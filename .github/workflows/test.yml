name: test

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: luac5.4 -p Data.lua Core.lua Options.lua || lua5.4 -e 'for _,f in ipairs{"Data.lua","Core.lua","Options.lua"} do assert(loadfile(f)) end'
      - name: Run tests
        run: lua5.4 tests/test_coefficients.lua
