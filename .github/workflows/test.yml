name: test

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax check
        run: lua5.4 -e 'for _,f in ipairs{"Compat.lua","Data.lua","Core.lua","Options.lua"} do assert(loadfile(f)) end'
      - name: Run tests against the current client API
        run: lua5.4 tests/test_coefficients.lua modern
      - name: Run tests against the legacy client API
        run: lua5.4 tests/test_coefficients.lua legacy
      - name: Run tests with no spell API present
        run: lua5.4 tests/test_bare_client.lua
